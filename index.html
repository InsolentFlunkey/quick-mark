<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickMark Markdown editor" />
    <link rel="stylesheet" href="/markdown.css" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>QuickMark</title>
    <script src="/markdown-renderer.js"></script>
    <script src="/editor-behavior.js"></script>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="document-actions" aria-label="Document actions">
          <button id="new-document" type="button">New</button>
          <button id="open-document" type="button">Open</button>
          <button id="save-document" type="button">Save</button>
          <button id="save-document-as" type="button">Save As</button>
          <button id="table-builder" type="button">Table Builder</button>
        </div>
        <div class="view-actions" aria-label="View actions">
          <label for="view-mode">View</label>
          <select id="view-mode">
            <option value="both">Split</option>
            <option value="input">Input</option>
            <option value="preview">Preview</option>
          </select>
          <button id="swap-panes" type="button">Swap</button>
        </div>
        <div class="status-row">
          <p class="document-status" id="document-status" role="status" aria-live="polite"></p>
          <div class="operation-feedback">
            <p class="operation-status" id="operation-status" role="status" aria-live="polite"></p>
            <button id="dismiss-operation-status" class="operation-status-dismiss" type="button" hidden>Dismiss</button>
          </div>
        </div>
        <aside class="read-only-banner" id="read-only-banner" hidden>
          <span>This file is read-only. You can edit it in memory and use Save As.</span>
          <button id="recheck-writable" type="button">Re-check</button>
        </aside>
      </header>
      <div class="workspace">
        <section class="editor-panel" aria-labelledby="editor-heading">
          <div class="panel-heading">
            <label id="editor-heading" for="editor">Markdown input</label>
            <span id="editor-status">0 characters</span>
          </div>
          <textarea
            id="editor"
            spellcheck="false"
            aria-describedby="editor-help"
            placeholder="# Start writing Markdown…"
          ></textarea>
          <p class="editor-help sr-only" id="editor-help">Press Escape, then Tab to leave the editor.</p>
        </section>
        <section class="preview-panel" aria-labelledby="preview-heading">
          <div class="panel-heading" id="preview-heading">Preview</div>
          <div class="viewer" id="preview"></div>
        </section>
      </div>
    </main>
    <dialog class="about-dialog" id="about-dialog" aria-labelledby="about-title">
      <div class="about-dialog__content">
        <h2 id="about-title">About QuickMark</h2>
        <p id="about-description"></p>
        <dl class="about-dialog__metadata">
          <div>
            <dt>Version</dt>
            <dd id="about-version"></dd>
          </div>
          <div>
            <dt>Creator</dt>
            <dd id="about-publisher"></dd>
          </div>
          <div>
            <dt>Repository</dt>
            <dd><button class="about-dialog__link" id="about-repository" type="button"></button></dd>
          </div>
        </dl>
        <form method="dialog">
          <button type="submit">Close</button>
        </form>
      </div>
    </dialog>
    <dialog class="table-dialog" id="table-dialog" aria-labelledby="table-dialog-title">
      <form class="table-dialog__content" id="table-form">
        <h2 id="table-dialog-title">Table Builder</h2>
        <p>Create a Markdown table at the current editor selection or cursor.</p>
        <div class="table-dialog__dimensions">
          <label>Columns <input id="table-columns" type="number" min="1" max="20" value="3" required></label>
          <label>Body rows <input id="table-rows" type="number" min="1" max="100" value="3" required></label>
        </div>
        <div class="table-dialog__columns" id="table-column-fields"></div>
        <label class="table-dialog__preview">Markdown preview
          <textarea id="table-preview" readonly rows="6"></textarea>
        </label>
        <p class="table-dialog__error" id="table-error" role="alert" hidden></p>
        <div class="table-dialog__actions">
          <button id="table-reset" type="button">Reset</button>
          <button id="table-cancel" type="button">Cancel</button>
          <button type="submit">Insert</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
