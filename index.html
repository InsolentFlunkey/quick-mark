<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QuickMark desktop application foundation" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>QuickMark</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="foundation">
      <p class="eyebrow">QuickMark Desktop</p>
      <h1>The cross-platform foundation is ready.</h1>
      <p>
        Markdown viewing and editing will move here incrementally. The existing
        browser application remains available as <code>QuickMark.html</code>
        during the migration.
      </p>
      <dl aria-label="Application foundation">
        <div>
          <dt>Frontend</dt>
          <dd>Vite + TypeScript</dd>
        </div>
        <div>
          <dt>Desktop shell</dt>
          <dd>Tauri 2</dd>
        </div>
        <div>
          <dt>Initial targets</dt>
          <dd>Linux + Windows</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
